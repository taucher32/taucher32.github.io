<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>taucher32 — Oyunlar / Games</title>
<meta name="description" content="Cubeword: küpleri çevir, harfleri bul, kelimeyi tamamla. Rotate cubes, find letters, build the word.">
<style>
  :root { color-scheme: light dark; --fg:#1f2937; --muted:#6b7280; --bg:#ffffff; --card:#f8fafc; --line:#e5e7eb; --accent:#4338ca; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e5e7eb; --muted:#94a3b8; --bg:#0f172a; --card:#1e293b; --line:#334155; --accent:#a5b4fc; }
  }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; max-width:760px; margin:0 auto; padding:40px 16px 80px; line-height:1.6; color:var(--fg); background:var(--bg); }
  h1 { font-size:1.4rem; margin:0 0 24px; }
  .card { display:flex; gap:20px; align-items:flex-start; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; }
  .card img { width:96px; height:96px; border-radius:20px; flex:none; }
  .card h2 { margin:0 0 4px; font-size:1.3rem; }
  .card p { margin:0 0 8px; }
  .muted { color:var(--muted); font-size:.95rem; }
  .links { display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
  .btn { display:inline-block; padding:8px 16px; border-radius:999px; text-decoration:none; font-weight:600; font-size:.95rem; }
  .primary { background:var(--accent); color:var(--bg); }
  .secondary { border:1px solid var(--line); color:var(--fg); }
  footer { margin-top:48px; color:var(--muted); font-size:.85rem; }
  @media (max-width:480px) { .card { flex-direction:column; } }
</style>
</head>
<body>
<h1>taucher32</h1>

<div class="card">
  <img src="cubeword-icon.png" alt="Cubeword simgesi / icon">
  <div>
    <h2>Cubeword</h2>
    <p>Küpleri çevir, harfleri bul, kelimeyi tamamla! Türkçe ve İngilizce oynanabilen kelime bulmaca oyunu.</p>
    <p class="muted">Rotate the cubes, find the letters, build the word! A word puzzle game in Turkish and English.</p>
    <div class="links">
      <a class="btn primary" href="https://play.google.com/store/apps/details?id=tr.huns84.cubeword">Google Play</a>
      <a class="btn secondary" href="https://taucher32.github.io/cubeword/privacy-policy.html">Gizlilik Politikası / Privacy Policy</a>
    </div>
  </div>
</div>

<footer>© 2026 taucher32</footer>
</body>
</html>
